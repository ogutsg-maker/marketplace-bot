<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Armenia AI Guide — Partner</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:radial-gradient(circle at 20% 0%,#26336e,transparent 40%),#080c18;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:28px 17px}.brand{font-size:22px;font-weight:800}.sub{color:#9da8bc;font-size:10px;letter-spacing:.2em;margin-top:4px}.card{margin-top:55px;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:rgba(255,255,255,.07);text-align:center}.icon{font-size:48px}h1{font-size:32px;margin:15px 0 10px}.muted{color:#aeb7c8;line-height:1.6}.status{margin:20px 0;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);color:#dce3ef}.btn{width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(135deg,#9d8cff,#63dfff);font-size:15px;font-weight:800;cursor:pointer}.secondary{margin-top:10px;background:rgba(255,255,255,.09);color:#fff}</style></head><body><div class="wrap"><div class="brand">✦ Armenia AI Guide</div><div class="sub">ARMENIA · AI CONCIERGE</div><div class="card"><div class="icon">🏢</div><h1 id="title">Գործընկերոջ բաժին</h1><p class="muted" id="text">Այստեղ կարող եք գրանցել ձեր բիզնեսը, անցնել ստուգում և կառավարել ծառայությունները։</p><div class="status" id="status">Բեռնվում է…</div><button class="btn" id="action">Բացել</button></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const uid=tg?.initDataUnsafe?.user?.id||0,initData=tg?.initData||'';const statusEl=document.getElementById('status'),btn=document.getElementById('action');async function load(){if(!uid){statusEl.textContent='Բացեք այս բաժինը Telegram հավելվածում։';return}try{const r=await fetch(`/api/master/${uid}/registration-status`,{headers:{'X-Telegram-Init-Data':initData}});const d=await r.json();if(d.registered&&d.status==='approved'){statusEl.textContent='✅ Գործընկերը հաստատված է';btn.textContent='Բացել գործընկերոջ աշխատասենյակը';btn.onclick=()=>location.href='master_cabinet.html';return}if(d.registered){statusEl.textContent=`Կարգավիճակ՝ ${d.status||'pending'} · Փաստաթուղթ՝ ${d.verification_status||'not_submitted'}`;btn.textContent='Շարունակել գրանցումը AI-ի միջոցով';}else{statusEl.textContent='Դեռ գրանցված չեք։ AI-ը կուղեկցի ձեզ ամբողջ գրանցման ընթացքում։';btn.textContent='Սկսել գրանցումը AI-ի միջոցով'}btn.onclick=()=>{if(tg?.sendData){tg.sendData(JSON.stringify({action:'partner_register'}));}else{alert('Բացեք Telegram հավելվածում')}}}catch(e){statusEl.textContent='Չհաջողվեց ստանալ կարգավիճակը։';btn.textContent='Կրկին փորձել';btn.onclick=load}}load();</script></body></html>
